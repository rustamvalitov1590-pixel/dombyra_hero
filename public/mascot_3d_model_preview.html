<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нұрәлі - 3D Cartoon Head</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #24160E, #0A0503);
      color: #FFF8E7;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; }
    
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      z-index: 10;
    }
    .header {
      pointer-events: auto;
      align-self: center;
      text-align: center;
      background: rgba(20, 10, 5, 0.85);
      border: 1.5px solid #D4AF37;
      border-radius: 20px;
      padding: 14px 28px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
      max-width: 600px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #6EE7B7;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    h1 { font-size: 20px; color: #FBBF24; margin-bottom: 4px; }
    p { font-size: 13px; color: #D6D3D1; line-height: 1.4; }

    .bottom-bar {
      pointer-events: auto;
      align-self: center;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      background: #2B180D;
      border: 1.5px solid #D4AF37;
      color: #FDE68A;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #3D2213;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212,175,55,0.3);
      color: #fff;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="overlay">
    <div class="header">
      <div class="badge">✦ Настоящая 3D Модель (Unreal / Skeletal Rig) ✦</div>
      <h1>ИИ Нұрәлі - 3D Анимация Головы и Взгляда</h1>
      <p id="status-desc">
        Поводите курсором мыши по экрану: Нұрәлі поворачивает голову и шею, плавно следя за вашим курсором!
      </p>
    </div>

    <div class="bottom-bar">
      <button class="btn" id="btn-nod">👏 Кивнуть (Nod)</button>
      <button class="btn" id="btn-shake">👋 Помахать головой</button>
      <button class="btn" id="btn-reset">🎯 Центрировать камеру</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const statusDesc = document.getElementById('status-desc');

    // 1. Scene setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0503, 0.04);

    // 2. Camera setup - focused on the cartoon head
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.62, 1.8);

    // 3. Renderer setup
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 4. OrbitControls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.58, 0);
    controls.minDistance = 1.0;
    controls.maxDistance = 4.0;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;

    // 5. Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.4);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffdfa9, 2.8);
    keyLight.position.set(2.5, 3.5, 3);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x059669, 1.3);
    fillLight.position.set(-2.5, 1.5, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 2.4);
    rimLight.position.set(0, 3, -3);
    scene.add(rimLight);

    // Pedestal
    const groundGeo = new THREE.CylinderGeometry(0.8, 0.9, 0.04, 64);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1f140e, roughness: 0.4, metalness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -0.02;
    scene.add(ground);

    const ringGeo = new THREE.TorusGeometry(0.85, 0.015, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4af37 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    // 6. Model & Bones
    let model = null;
    let headBone = null;
    let neckBone = null;
    let spineBone = null;
    let mouse = new THREE.Vector2(0, 0);

    // Custom gesture triggers
    let nodTimer = 0;
    let shakeTimer = 0;

    const loader = new GLTFLoader();
    loader.load(
      '/models/cartoon_head.glb',
      (gltf) => {
        model = gltf.scene;

        // Auto center and scale
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const scale = 1.5 / size.y;

        model.scale.set(scale, scale, scale);
        model.position.x = -center.x * scale;
        model.position.y = -box.min.y * scale;
        model.position.z = -center.z * scale;

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              child.material.envMapIntensity = 1.2;
              child.material.roughness = 0.55;
            }
          }
        });

        scene.add(model);

        // Find Unreal / Skeletal bones
        headBone = model.getObjectByName('head');
        neckBone = model.getObjectByName('neck_01');
        spineBone = model.getObjectByName('spine_03');

        console.log('Bones loaded:', { headBone, neckBone, spineBone });
      },
      undefined,
      (err) => {
        console.error('GLTF load error:', err);
        statusDesc.innerText = 'Қате: модель жүктелмеді (' + err.message + ')';
      }
    );

    // 7. Mouse tracking
    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // 8. Buttons logic
    document.getElementById('btn-nod').addEventListener('click', () => { nodTimer = 1.2; });
    document.getElementById('btn-shake').addEventListener('click', () => { shakeTimer = 1.2; });
    document.getElementById('btn-reset').addEventListener('click', () => {
      camera.position.set(0, 0.62, 1.8);
      controls.target.set(0, 0.58, 0);
      controls.update();
    });

    // 9. Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // Idle breathing float
      if (model) {
        model.position.y = -0.01 + Math.sin(elapsed * 2) * 0.012;
      }

      // 10. Natural Head & Neck Tracking
      if (headBone && neckBone) {
        // Natural target angle (eyes/head focus on cursor)
        const targetYaw = mouse.x * 0.55;
        const targetPitch = -mouse.y * 0.38;

        // Custom gestures
        let gesturePitch = 0;
        let gestureYaw = 0;
        if (nodTimer > 0) {
          nodTimer -= delta;
          gesturePitch = Math.sin((1.2 - nodTimer) * 12) * 0.25;
        }
        if (shakeTimer > 0) {
          shakeTimer -= delta;
          gestureYaw = Math.sin((1.2 - shakeTimer) * 12) * 0.25;
        }

        // Head bone takes 65% of rotation
        headBone.rotation.y = THREE.MathUtils.lerp(headBone.rotation.y, targetYaw * 0.65 + gestureYaw, 0.08);
        headBone.rotation.x = THREE.MathUtils.lerp(headBone.rotation.x, targetPitch * 0.60 + gesturePitch, 0.08);

        // Neck bone takes 35% of rotation (organic spinal distribution)
        neckBone.rotation.y = THREE.MathUtils.lerp(neckBone.rotation.y, targetYaw * 0.35, 0.08);
        neckBone.rotation.x = THREE.MathUtils.lerp(neckBone.rotation.x, targetPitch * 0.35, 0.08);

        // Spine micro-tilt
        if (spineBone) {
          spineBone.rotation.y = THREE.MathUtils.lerp(spineBone.rotation.y, targetYaw * 0.15, 0.05);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
