<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>Маскот Нұрәлі - 3D Pixar Интерактивті Көрініс</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #24160E, #0E0704);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #FFF8E7;
      gap: 36px;
      padding: 32px;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      color: #FBBF24;
      text-align: center;
      text-shadow: 0 4px 16px rgba(251, 191, 36, 0.3);
    }
    .badge {
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6EE7B7;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .grid {
      display: flex;
      gap: 56px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* 3D Interactive Mascot Container */
    .mascot-stage {
      perspective: 700px;
      cursor: pointer;
    }
    .mascot-3d {
      position: relative;
      transition: transform 0.1s ease-out;
      transform-style: preserve-3d;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mascot-float {
      animation: float 3.5s ease-in-out infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .mascot-img-wrap {
      width: 170px;
      filter: drop-shadow(0 16px 32px rgba(0,0,0,0.85));
      transition: filter 0.2s;
    }
    .mascot-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }
    .glow-aura {
      width: 150px;
      height: 20px;
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.6), rgba(245, 158, 11, 0.5), transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
      margin-top: -10px;
    }

    /* Avatar Circles */
    .avatar-circle {
      position: relative;
      border-radius: 50%;
      background: linear-gradient(135deg, #F59E0B, #10B981);
      padding: 3px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(245, 158, 11, 0.35);
      overflow: hidden;
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1A1009;
      overflow: hidden;
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .size-lg { width: 110px; height: 110px; }
    .size-sm { width: 56px; height: 56px; }

    .label {
      font-size: 13px;
      color: #FDE68A;
      font-weight: 600;
    }
    .hint {
      font-size: 11px;
      color: #A8A29E;
      max-width: 220px;
      text-align: center;
    }
  </style>
</head>

  <script>
    const mascot = document.getElementById('mascot3d');
    window.addEventListener('mousemove', (e) => {
      const rect = mascot.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const rotY = Math.max(-25, Math.min(25, dx / 25));
      const rotX = Math.max(-15, Math.min(15, -dy / 30));
      mascot.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;
    });
  </script>
